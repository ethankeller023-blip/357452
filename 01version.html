<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ethan James Keller</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #111;
      color: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    header {
      position: absolute;
      top: 32px;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      letter-spacing: 0.08em;
      font-weight: 400;
    }

    .focus {
      margin-top: 8px;
      font-size: 1rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #aaa;
    }

    .gallery-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      width: 100%;
      padding: 24px;
    }

    .image-frame {
      width: min(80vw, 700px);
      height: min(60vh, 460px);
      border: 1px solid #444;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .image-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    button {
      background: transparent;
      color: #f5f5f5;
      border: 1px solid #666;
      padding: 12px 18px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 0.8rem;
    }

    button:hover {
      background: #f5f5f5;
      color: #111;
    }
  </style>
</head>
<body>
  <header>
    <h1>Ethan James Keller</h1>
    <div class="focus">Creative</div>
  </header>

  <main class="gallery-wrapper">
    <button onclick="previousImage()">Previous Image</button>

    <section class="image-frame">
      <img id="portfolio-image" src="https://YOUR-BLOGSPOT-IMAGE-URL-1.jpg" alt="Creative portfolio image" />
    </section>

    <button onclick="nextImage()">Next Image</button>
  </main>

  <script>
    const images = [
      "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEg6cu0EgFYTNUS6zggJlYfjAUH6CeQK7ykglWvRADORj3n5t8y0XUp2ybPj1FMqEX6qpQsMERaNbY9Xs2v4MHy-gMqc50fXktWq0SbXxPdhEfQzKxgx8-HYKeVg7QwkgwSFy0svSUraTZda-2zFWDUVZW_BJRaj2YlM9RjOtRDpSIXmB4EUIZYMwZWHqZA/s600/IMG_7471.jpeg",
      "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEidhDnO6x9_I_YBGgEd-cFObtJzn3JR6idM2qcrQxEMQQeLo1vmWxSC2kYOlithl_MyJQnkRys0lOOKleHdMNfES7CT05O4pIvrYdGpeI1mi_TOf7i0i_o1DQmAfO06spDocg6yy6TrmGU3WcFLBn98n0JJaleqp6nA5P6XBBJraNLbfGa6xZMwzJd388I/s320/IMG_7464%202.jpg",
      "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEj-f_xYUh0CcFK3E2D0j0FAUG8mls65QRyP1l0i1lPKnlKsR4vj0pcVe0ie6RY0tcsaEOjG1Foq8J6-rhJIVmc1ICbedrKmAVKVjiFe0HLYWfzzzYQB5pznyiLvHVUhkBcoGAtOKBLiCV6fldJmGaGqOsFC7oM5I8eHIOVaVxf7zPGkn09xmdA5VlurOb0/w640-h707/Screenshot%202026-02-21%20at%208.11.47%E2%80%AFAM.png"
    ];

    let currentImageIndex = 0;
    const imageElement = document.getElementById("portfolio-image");

    function showImage(index) {
      imageElement.src = images[index];
    }

    function nextImage() {
      currentImageIndex = (currentImageIndex + 1) % images.length;
      showImage(currentImageIndex);
    }

    function previousImage() {
      currentImageIndex = (currentImageIndex - 1 + images.length) % images.length;
      showImage(currentImageIndex);
    }
  </script>
</body>
</html>
